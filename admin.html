<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파인하우스 관리자</title><style>
:root{--blue:#1769aa;--navy:#123b60;--line:#dfe8ef}*{box-sizing:border-box}body{margin:0;background:#f4f8fb;color:#18344b;font-family:Arial,'Malgun Gothic',sans-serif}.wrap{max-width:900px;margin:40px auto;padding:0 18px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 28px #123b6010}h1{font-size:25px;margin:0 0 8px}.muted{color:#718397;font-size:14px}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ccd9e3;border-radius:9px;font:inherit}.field textarea{min-height:170px;resize:vertical}button{border:0;border-radius:9px;padding:12px 17px;background:var(--blue);color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#eaf3fa;color:var(--navy)}.danger{background:#fff0f0;color:#b42318}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.hidden{display:none!important}.post{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0;display:flex;gap:14px;align-items:center}.post img{width:90px;height:70px;object-fit:cover;border-radius:8px}.post .grow{flex:1}.msg{margin:12px 0;padding:12px;border-radius:9px;background:#eef7ff;white-space:pre-wrap}.preview{display:flex;gap:8px;flex-wrap:wrap}.preview img{width:90px;height:75px;object-fit:cover;border-radius:8px}@media(max-width:600px){.wrap{margin:18px auto}.panel{padding:18px}.post{align-items:flex-start}.post img{width:70px;height:60px}}
</style></head><body><main class="wrap"><section class="panel" id="login"><h1>파인하우스 관리자</h1><p class="muted">관리자 계정으로 로그인해 주세요.</p><form id="loginForm"><div class="field"><label>아이디</label><input id="username" autocomplete="username" required></div><div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" required></div><button>로그인</button></form><div class="msg hidden" id="loginMsg"></div></section>
<section class="panel hidden" id="dashboard"><div class="row" style="justify-content:space-between"><div><h1>작업 현장 게시글 관리</h1><p class="muted">사진과 글을 작성하면 홈페이지에 반영됩니다.</p></div><button class="secondary" id="logout">로그아웃</button></div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h2 id="formTitle">새 게시글 작성</h2><form id="postForm"><input type="hidden" id="postId"><div class="field"><label>게시글 제목</label><input id="title" maxlength="100" required placeholder="예: 강서구 아파트 입주청소 현장"></div><div class="field"><label>분류</label><select id="category"><option>탈거청소</option><option>욕실 청소 및 위생관리</option><option>전체 바닥 및 몰딩</option><option>주방 기름때 제거</option><option>유리창 및 샷시 청소</option><option>베란다 청소</option></select></div><div class="field"><label>작업일</label><input id="workDate" type="date"></div><div class="field"><label>사진 첨부 (JPG/PNG/WEBP, 사진당 4MB 이하)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="preview" id="preview"></div><small class="muted">사진은 선택 후 업로드됩니다. 여러 장을 첨부할 수 있습니다.</small></div><div class="field"><label>게시글 내용</label><textarea id="body" required placeholder="작업 전 상태, 청소 과정, 사용한 관리 방법, 작업 후 상태 등을 작성하세요."></textarea></div><div class="row"><button id="save">게시글 게시</button><button type="button" class="secondary" id="reset">새 글 작성</button></div></form><div class="msg hidden" id="status"></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h2>등록된 게시글</h2><div id="posts"></div></section></main>
<script>
const $=id=>document.getElementById(id);let posts=[],selectedFiles=[];
function message(id,text){$(id).textContent=text;$(id).classList.remove('hidden')}
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'요청에 실패했습니다.');return d}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadPosts()}catch(err){message('loginMsg',err.message)}});
async function loadPosts(){posts=await api('/api/admin/posts');renderPosts()}
function renderPosts(){$('posts').innerHTML='';if(!posts.length){$('posts').innerHTML='<p class="muted">아직 등록된 게시글이 없습니다.</p>';return}posts.forEach(p=>{const el=document.createElement('div');el.className='post';const img=document.createElement('img');img.src=p.images?.[0]||'';img.alt='';const box=document.createElement('div');box.className='grow';const title=document.createElement('strong');title.textContent=p.title;const sub=document.createElement('div');sub.className='muted';sub.textContent=`${p.category} · ${p.workDate||'날짜 미입력'}`;box.append(title,sub);const edit=document.createElement('button');edit.className='secondary';edit.textContent='수정';edit.onclick=()=>editPost(p.id);const del=document.createElement('button');del.className='danger';del.textContent='삭제';del.onclick=()=>deletePost(p.id);el.append(img,box,edit,del);$('posts').append(el)})}
$('photos').addEventListener('change',()=>{selectedFiles=[...$('photos').files];$('preview').innerHTML='';selectedFiles.forEach(f=>{const im=document.createElement('img');im.src=URL.createObjectURL(f);$('preview').append(im)})});
async function uploadImages(){const urls=[];for(const f of selectedFiles){const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f)});const result=await api('/api/admin/upload',{method:'POST',body:JSON.stringify({name:f.name,data})});urls.push(result.url)}return urls}
$('postForm').addEventListener('submit',async e=>{e.preventDefault();$('save').disabled=true;try{const id=$('postId').value||crypto.randomUUID();const existing=posts.find(p=>p.id===id);const uploaded=await uploadImages();const post={id,title:$('title').value.trim(),category:$('category').value,workDate:$('workDate').value,body:$('body').value.trim(),images:[...(existing?.images||[]),...uploaded],updatedAt:new Date().toISOString(),createdAt:existing?.createdAt||new Date().toISOString()};const next=existing?posts.map(p=>p.id===id?post:p):[post,...posts];await api('/api/admin/posts',{method:'PUT',body:JSON.stringify({posts:next})});posts=next;renderPosts();resetForm();message('status','게시글이 저장되었습니다. 홈페이지에 반영되기까지 배포 시간이 조금 걸릴 수 있습니다.')}catch(err){message('status',err.message)}finally{$('save').disabled=false}});
function editPost(id){const p=posts.find(x=>x.id===id);if(!p)return;$('postId').value=p.id;$('title').value=p.title;$('category').value=p.category;$('workDate').value=p.workDate||'';$('body').value=p.body;$('formTitle').textContent='게시글 수정';$('save').textContent='수정 내용 저장';selectedFiles=[];$('photos').value='';$('preview').innerHTML=(p.images||[]).map(u=>`<img src="${u.replaceAll('"','&quot;')}" alt="기존 사진">`).join('');window.scrollTo({top:0,behavior:'smooth'})}
async function deletePost(id){if(!confirm('이 게시글을 삭제할까요?'))return;try{const next=posts.filter(p=>p.id!==id);await api('/api/admin/posts',{method:'PUT',body:JSON.stringify({posts:next})});posts=next;renderPosts();message('status','게시글을 삭제했습니다.')}catch(err){message('status',err.message)}}
function resetForm(){$('postForm').reset();$('postId').value='';$('formTitle').textContent='새 게시글 작성';$('save').textContent='게시글 게시';$('preview').innerHTML='';selectedFiles=[]}
$('reset').onclick=resetForm;$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};
</script></body></html>
